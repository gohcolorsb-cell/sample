<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サンプル画像ダウンローダー</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--card:#f2f2f7;--accent:#0a84ff;--bd:#d1d1d6}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--card:#1c1c1e;--bd:#3a3a3c}}
*{box-sizing:border-box}
body{margin:0;padding:max(12px,env(safe-area-inset-top)) 12px 40px;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif;max-width:760px;margin-inline:auto}
h1{font-size:18px}
label{display:block;font-size:12px;margin-top:10px;opacity:.7}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
textarea{height:80px}
button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
button.sub{background:var(--card);color:var(--accent);border:1px solid var(--bd);margin-left:6px}
.item{margin-top:20px;padding-top:12px;border-top:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.grid figure{margin:0}
.grid img{width:100%;min-height:120px;object-fit:contain;border-radius:8px;background:var(--card);display:block}
.grid a{color:var(--accent)}
.grid figcaption{font-size:11px;opacity:.6;text-align:center}
#msg{margin-top:10px;font-size:13px;white-space:pre-wrap}
details{margin-top:10px;font-size:13px}
</style>
</head>
<body>
<h1>FANZA同人 サンプル画像ダウンローダー</h1>

<label>API ID</label>
<input id="apiId" autocomplete="off" autocapitalize="off">
<label>アフィリエイトID(990〜999系)</label>
<input id="affId" autocomplete="off" autocapitalize="off">
<label>商品URLまたは cid(複数は改行)</label>
<textarea id="targets" placeholder="https://www.dmm.co.jp/dc/doujin/-/detail/=/cid=d_123456/&#10;d_234567"></textarea>

<details open>
<summary>詳細設定(プロキシ)</summary>
<label>プロキシURL(Cloudflare Worker。画像が表示・保存できないとき用。末尾は ?url= )</label>
<input id="proxy" placeholder="https://your-proxy.example.workers.dev/?url=" autocapitalize="off">
</details>

<button id="go">画像を取得</button>
<button id="saveAll" class="sub" hidden>全部保存</button>
<div id="msg"></div>
<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
["apiId","affId","proxy"].forEach(id => { $(id).value = store.get(id); });

let found = []; // {cid, urls}

const cidOf = s => { const m = s.match(/cid=([A-Za-z0-9_]+)/); return m ? m[1] : s.trim().replace(/\//g,""); };

async function fetchItem(cid){
  const p = new URLSearchParams({
    api_id:$("apiId").value.trim(), affiliate_id:$("affId").value.trim(),
    site:"FANZA", service:"doujin", floor:"digital_doujin", cid, output:"json"
  });
  let url = "https://api.dmm.com/affiliate/v3/ItemList?" + p;
  const proxy = $("proxy").value.trim();
  if (proxy) url = proxy + encodeURIComponent(url);
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const items = (await r.json()).result?.items || [];
  if (!items.length) return null;
  const s = items[0].sampleImageURL || {};
  const urls = s.sample_l?.image || s.sample_s?.image || [];
  return { cid, title: items[0].title, urls };
}

$("go").onclick = async () => {
  ["apiId","affId","proxy"].forEach(id => store.set(id, $(id).value));
  const cids = [...new Set($("targets").value.split("\n").map(cidOf).filter(Boolean))];
  if (!$("apiId").value || !$("affId").value || !cids.length){ $("msg").textContent = "API ID・アフィリエイトID・cid を入力してください"; return; }
  $("out").innerHTML = ""; found = []; $("saveAll").hidden = true;
  for (const cid of cids){
    $("msg").textContent = "取得中… " + cid;
    try{
      const it = await fetchItem(cid);
      if (!it || !it.urls.length){ $("out").insertAdjacentHTML("beforeend", `<div class="item">${cid}: 見つかりませんでした</div>`); continue; }
      found.push(it);
      const div = document.createElement("div"); div.className = "item";
      const h = document.createElement("div"); h.textContent = `${it.title}(${it.urls.length}枚)`; h.style.fontWeight = 600;
      const grid = document.createElement("div"); grid.className = "grid";
      it.urls.forEach((u,i) => {
        const f = document.createElement("figure");
        f.innerHTML = `<img referrerpolicy="no-referrer"><figcaption></figcaption>`;
        const img = f.querySelector("img"), cap = f.querySelector("figcaption");
        const src = imgUrl(u);
        let step = 0;
        img.onerror = () => {
          if (step === 0){ step = 1; img.removeAttribute("referrerpolicy"); img.src = src + (src.includes("?") ? "&" : "?") + "r=1"; }
          else { img.style.display = "none"; cap.innerHTML = `読込失敗<br><a href="${src}" target="_blank" rel="noopener">開く</a>`; }
        };
        img.src = src;
        cap.textContent = name(cid,i,u);
        grid.appendChild(f);
      });
      div.append(h, grid); $("out").appendChild(div);
    }catch(e){
      $("msg").textContent = `${cid}: 取得失敗(${e.message})。ブラウザのCORS制限の可能性があります。詳細設定のプロキシか、Mac用Pythonスクリプトを使ってください。`;
      return;
    }
  }
  $("msg").textContent = found.length ? "取得完了。画像を長押しでも保存できます。" : "";
  $("saveAll").hidden = !found.length;
};

function imgUrl(u){
  const s = u.replace(/^http:/, "https:"), px = $("proxy").value.trim();
  return px ? px + encodeURIComponent(s) : s;
}
const name = (cid,i,u) => `${cid}_${String(i+1).padStart(2,"0")}${(u.split("?")[0].match(/\.\w+$/)||[".jpg"])[0]}`;

$("saveAll").onclick = async () => {
  let ok = 0, ng = 0;
  for (const it of found){
    for (let i=0;i<it.urls.length;i++){
      try{
        const blob = await (await fetch(imgUrl(it.urls[i]))).blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name(it.cid,i,it.urls[i]);
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
        ok++; $("msg").textContent = `保存中… ${ok}枚`;
        await new Promise(r => setTimeout(r, 400));
      }catch(e){ ng++; }
    }
  }
  $("msg").textContent = ng
    ? `${ok}枚保存。${ng}枚はブラウザの制限で保存できませんでした。画像を長押しして「"写真"に追加」で保存してください。`
    : `${ok}枚を保存しました。`;
};
</script>
</body>
</html>
